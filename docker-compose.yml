services:
  mirror-hub:
    build: .
    container_name: xda-mirror-hub
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SESSION_SECRET=${SESSION_SECRET:-secret-xda-mirror-key}
      - DATA_DIR=/data
    volumes:
      - mirror_data:/data

volumes:
  mirror_data:
    driver: local
